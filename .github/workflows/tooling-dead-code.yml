name: tooling-dead-code

# Unused executable code in the canonical tooling. tools/dead-code/check_dead_code.py runs
# vulture over the Python paths in pyproject.toml [tool.vulture] and knip over each
# JavaScript producer in tools/dead-code/knip.json, from a source-based entrypoint
# inventory. Both run offline against the hash-locked Python install and the npm lockfiles.
# Workflows are in the path filter because the inventory reads what they run.

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'requirements-tooling.txt'
      - 'tools/**'
      - 'plugins/research-ops/skills/source-hunter/scripts/**'
      - 'plugins/research-ops/skills/source-hunter/tests/**'
      - 'plugins/research-ops/skills/source-hunter/SKILL.md'
      - 'plugins/research-ops/skills/video-discovery/scripts/**'
      - 'plugins/research-ops/skills/video-discovery/tests/**'
      - 'plugins/research-ops/skills/video-discovery/SKILL.md'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements-tooling.txt'
      - 'tools/**'
      - 'plugins/research-ops/skills/source-hunter/scripts/**'
      - 'plugins/research-ops/skills/source-hunter/tests/**'
      - 'plugins/research-ops/skills/source-hunter/SKILL.md'
      - 'plugins/research-ops/skills/video-discovery/scripts/**'
      - 'plugins/research-ops/skills/video-discovery/tests/**'
      - 'plugins/research-ops/skills/video-discovery/SKILL.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dead-code:
    name: unused code (vulture and knip, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install vulture (hash-locked)
        run: python -m pip install --quiet --require-hashes -r requirements-tooling.txt
      - name: Install the JavaScript producers (lockfiles)
        run: |
          set -euo pipefail
          for producer in tools/capability-feed tools/skill-map; do
            (cd "$producer" && npm ci --ignore-scripts --no-audit --no-fund)
          done
      - name: Unused code check
        run: python tools/dead-code/check_dead_code.py
      - name: Fixture tests
        env:
          DEADCODE_REQUIRE_TOOLS: "1"
        run: python -m unittest discover -s tools/dead-code/tests -v

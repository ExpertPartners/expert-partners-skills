# factory-automation: c4403a85-510b-4eab-86ba-14c2a90568cc
# The builder itself lives in factory-builder-reusable.yml. Another repo installs it by
# copying this file and changing the uses: line to
# ExpertPartners/expert-partners-skills/.github/workflows/factory-builder-reusable.yml@main
# The builder prompt there carries this rule, and every installed copy of this file keeps it:
# Never ask the user inside Factory. Put any question on the GitHub issue as a comment starting Question for Allison, or on the job list as needs-allison with a line starting Recommend:, and keep working on everything else.
name: Chat to Code Loop Builder - Skills
"on":
  workflow_dispatch:
    inputs:
      issue:
        description: Number of the job issue to build
        required: true
  issues:
    types:
      - labeled
      - opened
      # closed and unlabeled (in-progress) only restart waiting jobs.
      - closed
      - unlabeled
  # Runs from main and never checks out pull request code. It only restarts waiting jobs.
  pull_request_target:
    types:
      - closed
permissions:
  actions: write
  contents: read
  id-token: write
  issues: write
  pull-requests: read
jobs:
  builder:
    uses: ./.github/workflows/factory-builder-reusable.yml
    with:
      ledger_access_enabled: true
    secrets:
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
      FACTORY_LEDGER_MCP_TOKEN: ${{ secrets.FACTORY_LEDGER_MCP_TOKEN }}

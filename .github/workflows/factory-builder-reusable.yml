# Reusable Factory builder for the Chat to Code Loop (Decision Log 2026-11-02, New mission,
# Factory never stalls: the Factory builder is installed in every repo from one template).
#
# A repo installs the builder with one small caller file. Copy
# factory-chat-to-code-loop-builder-skills.yml from this repo, keep its triggers and
# permissions, and point its uses: line here:
#
#   uses: ExpertPartners/expert-partners-skills/.github/workflows/factory-builder-reusable.yml@main
#
# FACTORY_API_KEY comes from the organization-level Actions secret of that name. A
# repository secret with the same name overrides it, so remove the repository copy once the
# organization secret is set.
#
# Four jobs:
#   gate        Runs tools/overlap-check (checked out from this repo's main, so a pull
#               request cannot loosen it) before every build. A job that changes the same
#               file as an open builder pull request or another in-progress job waits with
#               a comment naming it. Nothing else holds a build (Decision Log 2026-11-02,
#               No caps stop work). A second event for a job another run is still building
#               follows that run with a receipt comment, so one job has one writer.
#   build       The Factory droid. Its first step confirms that the gate admitted this very
#               run for the job, so a re-run of a run another admission has replaced never
#               writes beside it. When the job already has an open builder pull request,
#               the build checks out that branch and the droid continues that pull request
#               instead of opening another (one job, one writer, one pull request).
#   release     After a build the gate started, when no open pull request closes the job,
#               removes in-progress so the job stops holding its files. A build that did
#               not succeed goes back to waiting. A job closed, parked or marked done
#               while it built holds its files until here, then loses in-progress.
#               Whenever in-progress is removed, every other waiting job that can start
#               now is dispatched.
#   redispatch  When a pull request or issue closes, an issue loses in-progress, or an
#               issue gains or loses parked or done, dispatches every waiting job that can
#               start now. On pull_request_target it
#               never checks out pull request code, only the overlap check from main.
name: Factory Builder (reusable)
"on":
  workflow_call:
    inputs:
      model:
        description: Model the Factory droid runs on
        type: string
        default: claude-opus-5-5
      ledger_access_enabled:
        description: Require authenticated ledger access for this provisioned caller
        type: boolean
        default: false
      ledger_mcp_url:
        description: Approved Factory bearer MCP endpoint
        type: string
        default: ""
    secrets:
      FACTORY_LEDGER_MCP_TOKEN:
        required: false
      FACTORY_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  gate:
    # Three ways in, each building an issue once:
    # 1. Manual dispatch (also how the redispatch job restarts a waiting job).
    # 2. The job label added to an issue from an allowlisted author. A job label the
    #    Factory app adds to a "Job:" issue is skipped, because path 3 added it and is
    #    already building that issue.
    # 3. A "Job:" issue opened by an allowlisted author without the job label. This run
    #    adds the label itself, then builds. An issue opened with the label already on it
    #    is left to path 2, which GitHub starts for that label.
    # The github context here is the caller's, so these are the caller's event fields.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'job' &&
        contains(fromJSON('["AllisonGaddy","expertpartners","expertpartners-ember","expertpartners-aura"]'), github.event.issue.user.login) &&
        !(github.event.sender.login == 'factory-droid[bot]' && startsWith(github.event.issue.title, 'Job:'))) ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, 'Job:') &&
        contains(fromJSON('["AllisonGaddy","expertpartners","expertpartners-ember","expertpartners-aura"]'), github.event.issue.user.login) &&
        !contains(github.event.issue.labels.*.name, 'job'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Reads the build run recorded for a closed, parked or done job, which holds its files
      # until that run's build job ends.
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      start: ${{ steps.check.outputs.start }}
    steps:
      - name: Checkout the overlap check
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          path: .factory-builder-tools
          persist-credentials: false
          sparse-checkout: tools/overlap-check
      - name: Overlap check
        id: check
        env:
          OVERLAP_TOKEN: ${{ github.token }}
          OVERLAP_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          set -euo pipefail
          script=.factory-builder-tools/tools/overlap-check/overlap_check.py
          if [ ! -f "$script" ]; then
            echo "::notice::The overlap check is not on main yet; building without it."
            echo "start=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 "$script" check

  build:
    needs: gate
    if: needs.gate.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Read only: the owner check reads the job's issue, pull requests and recorded run.
      actions: read
      contents: read
      id-token: write
      issues: read
      pull-requests: read
    steps:
      - name: Checkout the overlap check
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          path: .factory-builder-tools
          persist-credentials: false
          sparse-checkout: tools/overlap-check
      - name: Confirm this run still owns the job
        # A "Re-run failed jobs" repeats this job without the gate, so ownership is checked
        # here too. The check moves out of the caller checkout before the build checks out.
        id: owner
        env:
          OVERLAP_TOKEN: ${{ github.token }}
          OVERLAP_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          set -euo pipefail
          tools_dir=$(mktemp -d "$RUNNER_TEMP/factory-builder-tools.XXXXXX")
          mv "$GITHUB_WORKSPACE/.factory-builder-tools" "$tools_dir/source"
          script="$tools_dir/source/tools/overlap-check/overlap_check.py"
          if [ ! -f "$script" ]; then
            echo "::notice::The overlap check is not on main yet; building without it."
            exit 0
          fi
          OVERLAP_NOTE_FILE="$RUNNER_TEMP/factory-continuation.txt" python3 "$script" owner
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The job's open pull request branch when it has one, otherwise the default.
          ref: ${{ steps.owner.outputs.branch }}
      - name: Install Factory Droid
        run: |
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Assert clean caller checkout before access setup
        if: ${{ inputs.ledger_access_enabled }}
        run: |
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/factory-access-caller-before"
          if [ -s "$RUNNER_TEMP/factory-access-caller-before" ]; then
            echo "::error::Caller checkout must be clean before Factory access setup."
            exit 1
          fi
      - name: Checkout canonical Factory access preflight
        if: ${{ inputs.ledger_access_enabled }}
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          path: .factory-access-tools
          persist-credentials: false
          sparse-checkout: tools/factory-access
      - name: Stage canonical helper outside caller checkout
        if: ${{ inputs.ledger_access_enabled }}
        shell: bash
        run: |
          helper_dir=$(mktemp -d "$RUNNER_TEMP/factory-access-tools.XXXXXX")
          mv "$GITHUB_WORKSPACE/.factory-access-tools" "$helper_dir/source"
          printf 'FACTORY_ACCESS_PREFLIGHT=%s\n' "$helper_dir/source/tools/factory-access/preflight.py" >> "$GITHUB_ENV"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/factory-access-caller-after-stage"
          cmp "$RUNNER_TEMP/factory-access-caller-before" "$RUNNER_TEMP/factory-access-caller-after-stage"
      - name: Verify and configure Factory ledger access
        if: ${{ inputs.ledger_access_enabled }}
        timeout-minutes: 3
        env:
          FACTORY_LEDGER_MCP_URL: ${{ inputs.ledger_mcp_url || vars.FACTORY_LEDGER_MCP_URL }}
          FACTORY_LEDGER_MCP_TOKEN: ${{ secrets.FACTORY_LEDGER_MCP_TOKEN }}
          FACTORY_LEDGER_JOB_ID: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          python3 "$FACTORY_ACCESS_PREFLIGHT"
          git status --porcelain=v1 --untracked-files=all > "$RUNNER_TEMP/factory-access-caller-after-preflight"
          cmp "$RUNNER_TEMP/factory-access-caller-before" "$RUNNER_TEMP/factory-access-caller-after-preflight"
      - name: Write automation prompt
        env:
          FACTORY_AUTOMATION_PROMPT: "You are the Builder for Expert Partners' Chat to Code Loop. Act only when this run was started by the label job being added to an issue, by a new issue whose title begins with Job: that this workflow labeled job when it opened, by a comment that begins with Factory, build this job on an issue that carries the label job, or by a manual dispatch whose issue input names such an issue; otherwise exit with no changes. The triggering GitHub event is in the JSON file named by the GITHUB_EVENT_PATH environment variable, read it to find the issue number (for a manual dispatch it is inputs.issue). Read the issue in full. Its body holds the mission, objective, files in scope, acceptance checks and decisions already made. Follow CLAUDE.md and AGENTS.md if present. Add the label in-progress to the issue. Work only inside the files in scope, run tools/validate-job.sh until it prints validate-job: PASS, push a branch named job/<issue number>-<short slug>, and open exactly one pull request into main whose body starts with the line Closes #<issue number> and then lists each acceptance check as PASS or FAIL with the command output as evidence. Never push to main or merge. If anything is unclear, open the pull request as a draft and say exactly what is unclear. Never ask the user inside Factory. Put any question on the GitHub issue as a comment starting Question for Allison, or on the job list as needs-allison with a line starting Recommend:, and keep working on everything else."
        run: |
          printf '%s' "$FACTORY_AUTOMATION_PROMPT" > "$RUNNER_TEMP/factory-automation-prompt.txt"
      - name: Continue the job's existing pull request
        if: steps.owner.outputs.note == 'true'
        run: |
          printf '\n\n' >> "$RUNNER_TEMP/factory-automation-prompt.txt"
          cat "$RUNNER_TEMP/factory-continuation.txt" >> "$RUNNER_TEMP/factory-automation-prompt.txt"
      - name: Get Factory GitHub App token
        shell: bash
        run: |
          # Exchange this run's GitHub OIDC token for a Factory GitHub App installation
          # token scoped to this repository, so later steps can push, comment and open
          # pull requests as the Factory app. When no token can be obtained the run
          # continues without one.
          skip() {
            echo "::warning::$1 Continuing without a GitHub token, so the prompt cannot write to GitHub."
            exit 0
          }
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            skip "This run has no GitHub OIDC token (the workflow needs id-token: write; pull requests from forks never get one)."
          fi
          command -v jq >/dev/null || skip "jq is not installed on this runner."
          oidc_token=$(curl -fsS --retry 3 --retry-delay 2 --retry-all-errors \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=droid-github-action" | jq -r '.value // empty') \
            || skip "Requesting a GitHub OIDC token failed."
          [ -n "$oidc_token" ] || skip "GitHub returned an empty OIDC token."
          response="$RUNNER_TEMP/factory-github-token.json"
          # Never leave an exchange response (success or failure body) behind for the
          # later steps to read.
          trap 'rm -f "$response"' EXIT
          status=$(curl -sS --retry 3 --retry-delay 2 -o "$response" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $oidc_token" \
            https://app.factory.ai/api/github/token-exchange) \
            || skip "The Factory token exchange could not be reached."
          if [ "$status" != "200" ]; then
            code=$(jq -r '.error_code // .error // empty' "$response" 2>/dev/null || true)
            case "$code" in
              workflow_not_found_on_default_branch|workflow_modified_from_default_branch|workflow_validation_failed)
                skip "The Factory GitHub App token is only available to the version of this workflow file that is on the default branch (merge the pull request that adds or changes it)." ;;
              app_not_installed)
                skip "The Factory GitHub App is not installed on this repository (install it at https://github.com/apps/factory-droid)." ;;
              *)
                skip "The Factory token exchange failed (HTTP $status${code:+, $code})." ;;
            esac
          fi
          token=$(jq -r '.token // empty' "$response" 2>/dev/null || true)
          [ -n "$token" ] || skip "The Factory token exchange returned no token."
          echo "::add-mask::$token"
          # GH_TOKEN is a Factory GitHub App installation token for this repository only
          # (it expires after one hour). gh reads it directly; git reads it through the
          # credential helper below.
          echo "GH_TOKEN=$token" >> "$GITHUB_ENV"
          # actions/checkout stored the read-only Actions token as an Authorization
          # header on this clone, which git would send instead of consulting a
          # credential helper. Drop it so pushes authenticate as the Factory app.
          git config --local --unset-all "http.$GITHUB_SERVER_URL/.extraheader" || true
          git config --local --replace-all credential.helper ''
          git config --local --add credential.helper '!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'
          git config user.name >/dev/null || git config --local user.name 'factory-droid[bot]'
          git config user.email >/dev/null || git config --local user.email '138933559+factory-droid[bot]@users.noreply.github.com'
          echo "GitHub writes from this run are made as the Factory GitHub App."
      - name: Label the new job issue
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No Factory GitHub App token, so the job label cannot be added and the job cannot be built."
            exit 1
          fi
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label job
      - name: Run Factory Droid
        shell: bash
        run: |
          extra_tools=()
          if [ "$FACTORY_LEDGER_ACCESS_ENABLED" = "true" ]; then
            extra_tools=(--add-tools MCP:factory-ledger)
          fi
          droid exec --auto high "${extra_tools[@]}" -m "$FACTORY_MODEL" -f "$RUNNER_TEMP/factory-automation-prompt.txt"
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          FACTORY_MODEL: ${{ inputs.model }}
          FACTORY_LEDGER_ACCESS_ENABLED: ${{ inputs.ledger_access_enabled }}
          FACTORY_LEDGER_MCP_TOKEN: ${{ inputs.ledger_access_enabled && secrets.FACTORY_LEDGER_MCP_TOKEN || '' }}

  release:
    # A build that ends without a pull request for its job must not keep holding its files.
    needs: [gate, build]
    if: always() && needs.gate.outputs.start == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout the overlap check
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          path: .factory-builder-tools
          persist-credentials: false
          sparse-checkout: tools/overlap-check
      - name: Release the job unless its pull request holds its files
        id: release
        env:
          OVERLAP_TOKEN: ${{ github.token }}
          OVERLAP_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          script=.factory-builder-tools/tools/overlap-check/overlap_check.py
          if [ ! -f "$script" ]; then
            echo "::notice::The overlap check is not on main yet; nothing to release."
            exit 0
          fi
          python3 "$script" release
      - name: Start every waiting job this build was holding
        # The release's own label change starts no workflow, so this pass is what lets the
        # jobs waiting on this build start once it can no longer write. OVERLAP_ISSUE keeps
        # the released job itself out, so a failing build never restarts itself in a loop.
        if: steps.release.outputs.restart == 'true'
        env:
          OVERLAP_TOKEN: ${{ github.token }}
          OVERLAP_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
          BUILDER_WORKFLOW_REF: ${{ github.workflow_ref }}
          BUILDER_REF: ${{ github.event.repository.default_branch }}
        run: python3 .factory-builder-tools/tools/overlap-check/overlap_check.py next

  redispatch:
    # Each of these can free the files a waiting job needs: a closed pull request, a closed
    # issue, an issue that loses in-progress, or an issue marked parked or done (a closed,
    # parked or done job holds nothing while a stale in-progress is still on it; one whose
    # build is still running holds until the release job above frees it). Removing parked
    # or done puts a waiting job back in line, so that restarts too. Changes made with
    # github.token start no workflow, so the check's own label edits never land here.
    if: >-
      ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request') &&
        github.event.action == 'closed') ||
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'issues' && github.event.action == 'unlabeled' &&
        github.event.label.name == 'in-progress') ||
      (github.event_name == 'issues' &&
        (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        (github.event.label.name == 'parked' || github.event.label.name == 'done'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout the overlap check
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          path: .factory-builder-tools
          persist-credentials: false
          sparse-checkout: tools/overlap-check
      - name: Start every waiting job that can build now
        env:
          OVERLAP_TOKEN: ${{ github.token }}
          # The caller's workflow file, which this dispatch starts again.
          BUILDER_WORKFLOW_REF: ${{ github.workflow_ref }}
          BUILDER_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          script=.factory-builder-tools/tools/overlap-check/overlap_check.py
          if [ ! -f "$script" ]; then
            echo "::notice::The overlap check is not on main yet; nothing to do."
            exit 0
          fi
          python3 "$script" next

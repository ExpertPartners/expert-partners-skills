# One question inbox (Decision Log 2026-11-02, Fix the holes now, and the HQ Rulebook
# section Handoffs between AIs). A builder that is stuck writes a line starting
# Question for Allison or Blocked, or opens a draft with a What is unclear section.
# This copies those words into one comment on the linked Job issue, starting
# Question for Allison, so the watcher puts it on the AI Work Board.
#
# Nothing from the pull request is checked out or run. The body and comments are read
# from the event file by the script below, never pasted into a shell command. Pull
# requests from forks are skipped, so outside text never reaches the board.
#
# The pull_request path runs the workflow as it is on the pull request branch. The
# comment and review paths run only the copy on main, so they start working once this
# file is merged.
name: questions-to-job-list

# Triggers disabled 2026-11-09. The job list and Job issue question route are retired;
# questions go to Allison in the live chat. History is kept; manual runs only.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: questions-to-job-list-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  copy:
    name: questions-to-job-list
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        github.event.comment.user.login == 'factory-droid[bot]') ||
      (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.user.login == 'factory-droid[bot]') ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.comment.user.login == 'factory-droid[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy questions to the linked Job issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, urllib.error, urllib.request

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          REPO = os.environ["GITHUB_REPOSITORY"]
          EVENT = os.environ["GITHUB_EVENT_NAME"]
          DRY_RUN = os.environ.get("DRY_RUN") == "1"
          BOT = "factory-droid[bot]"
          MARK = "questions-to-job-list:"
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              payload = json.load(f)

          def api(path, method="GET", data=None):
              req = urllib.request.Request(
                  path if path.startswith("http") else f"{API}{path}",
                  method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp), resp.headers.get("Link", "")

          def api_all(path):
              items, url = [], f"{API}{path}{'&' if '?' in path else '?'}per_page=100"
              while url:
                  page, link = api(url)
                  items += page
                  m = re.search(r'<([^>]+)>;\s*rel="next"', link)
                  url = m.group(1) if m else None
              return items

          FENCE = re.compile(r"^\s*(```|~~~)")
          LEAD = re.compile(r"^[\s>*_#+-]*(?:\d+[.)]\s+)?[\s*_]*")
          ASK = re.compile(r"^(Question for Allison|Blocked)\b")
          UNCLEAR = re.compile(r"^What is unclear\b", re.I)
          HEADING = re.compile(r"^\s{0,3}(#{1,6})\s")

          def prose(text):
              # Yields (line, fenced) so quoted examples in code blocks are never copied.
              fenced = False
              for line in (text or "").replace("\r\n", "\n").split("\n"):
                  if FENCE.match(line):
                      fenced = not fenced
                      yield line, True
                      continue
                  yield line, fenced

          def ask_lines(text):
              return [line.strip() for line, fenced in prose(text)
                      if not fenced and ASK.match(LEAD.sub("", line))]

          def unclear_section(text):
              out, level = [], None
              for line, fenced in prose(text):
                  head = HEADING.match(line)
                  if level is None:
                      if fenced or not UNCLEAR.match(LEAD.sub("", line)):
                          continue
                      level = len(head.group(1)) if head else 7
                      rest = re.sub(r"^What is unclear[\s*_:.?-]*", "", LEAD.sub("", line), flags=re.I)
                      if rest.strip():
                          out.append(rest.strip())
                      continue
                  if head and not fenced and len(head.group(1)) <= level:
                      break
                  out.append(line.rstrip())
              return "\n".join(out).strip()

          if EVENT == "pull_request":
              pr = payload["pull_request"]
              source_text, source_url = pr.get("body") or "", pr["html_url"]
              unclear = unclear_section(source_text) if (pr.get("draft") or payload.get("action") == "ready_for_review") else ""
              where = f"pull request #{pr['number']}"
          else:
              comment = payload.get("comment") or payload.get("review")
              if comment["user"]["login"] != BOT:
                  sys.exit(0)
              number = (payload.get("pull_request") or payload["issue"])["number"]
              pr = payload.get("pull_request") or api(f"/repos/{REPO}/pulls/{number}")[0]
              source_text, source_url, unclear = comment.get("body") or "", comment["html_url"], ""
              where = f"a {BOT} comment on pull request #{pr['number']}"

          # The issue_comment event carries no head repository, so check it on the fetched
          # pull request; head.repo is null when a fork was deleted.
          if ((pr.get("head") or {}).get("repo") or {}).get("full_name") != REPO:
              print(f"{where} does not come from a branch of {REPO}; nothing copied.")
              sys.exit(0)

          asks = ask_lines(source_text)
          if unclear:
              asks = [a for a in asks if a not in unclear]
          if not asks and not unclear:
              print(f"No question lines in {where}; nothing to copy.")
              sys.exit(0)

          m = re.search(r"(?i)\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b", pr.get("body") or "")
          m = m or re.match(r"^job/(\d+)-", pr["head"]["ref"])
          if not m:
              print(f"::notice::{where} has questions but names no Job issue (Closes #N or a job/N- branch).")
              sys.exit(0)
          issue_number = int(m.group(1))
          try:
              issue = api(f"/repos/{REPO}/issues/{issue_number}")[0]
          except urllib.error.HTTPError as e:
              print(f"::notice::Issue #{issue_number} could not be read ({e.code}); nothing copied.")
              sys.exit(0)
          labels = {l["name"] for l in issue.get("labels", [])}
          if issue.get("pull_request") or not ("job" in labels or issue["title"].startswith("Job:")):
              print(f"::notice::#{issue_number} is not a Job issue; nothing copied.")
              sys.exit(0)

          parts = [f"Question for Allison, from {where}: {pr['title']}", ""]
          parts += asks
          if unclear:
              parts += (["", ""] if asks else []) + ["What is unclear:", "", unclear]
          content = "\n".join(parts)
          if len(content) > 60000:
              content = content[:60000] + "\n\n(cut short, read the rest at the link)"
          # The title is left out of the key, so editing it never posts the same question twice.
          key = "\n".join([str(pr["number"]), *asks, "", unclear])
          digest = hashlib.sha256(key.encode()).hexdigest()[:16]
          body = f"{content}\n\nSource: {source_url}\n\n<!-- {MARK}{digest} -->"

          if any(f"{MARK}{digest}" in (c.get("body") or "")
                 for c in api_all(f"/repos/{REPO}/issues/{issue_number}/comments")):
              print(f"These questions are already on #{issue_number}; nothing new to copy.")
              sys.exit(0)
          if DRY_RUN:
              print(f"DRY_RUN: would comment on #{issue_number}:\n{body}")
              sys.exit(0)
          posted = api(f"/repos/{REPO}/issues/{issue_number}/comments", "POST", {"body": body})[0]
          print(f"Copied to #{issue_number}: {posted['html_url']}")
          PY

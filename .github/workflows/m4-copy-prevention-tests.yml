name: M4 copy prevention tests
on:
  pull_request:
    paths:
      - "tools/hooks/**"
      - "tools/maintenance/**"
      - ".github/workflows/m4-copy-prevention-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/hooks/**"
      - "tools/maintenance/**"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: bash tools/hooks/tests/test-ai-copy-guard.sh
      - run: bash tools/maintenance/tests/test-m4-scratch-janitor.sh

name: Factory access smoke

# Manual, read-only acceptance on a fresh runner. No model turn or builder job.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Existing repository job issue for the read-only ledger check
        required: true
        type: string

permissions:
  contents: read

jobs:
  access:
    if: github.ref == 'refs/heads/main' && github.repository == 'ExpertPartners/expert-partners-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate existing issue input
        env:
          FACTORY_LEDGER_JOB_ID: ${{ inputs.issue }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          valid = re.fullmatch(r"[1-9][0-9]{0,9}", os.environ.get("FACTORY_LEDGER_JOB_ID", ""))
          print("Factory access smoke input: " + ("PASS" if valid else "FAIL"))
          sys.exit(0 if valid else 1)
          PY
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          repository: ExpertPartners/expert-partners-skills
          ref: main
          persist-credentials: false
      - name: Install official Factory Droid
        shell: bash
        run: |
          set +x
          if timeout --kill-after=5s 90s bash -o pipefail -c 'curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh' >/dev/null 2>&1; then
            echo "Factory Droid install: PASS"
          else
            echo "Factory Droid install: FAIL"
            exit 1
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify exact job read and native MCP connection
        env:
          FACTORY_LEDGER_JOB_ID: ${{ inputs.issue }}
          FACTORY_LEDGER_MCP_URL: ${{ vars.FACTORY_LEDGER_MCP_URL }}
          FACTORY_LEDGER_MCP_TOKEN: ${{ secrets.FACTORY_LEDGER_MCP_TOKEN }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import signal
          import subprocess
          import sys

          def run_captured(arguments, seconds):
              child = subprocess.Popen(
                  arguments, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE, start_new_session=True,
              )
              try:
                  output, error = child.communicate(timeout=seconds)
                  return child.returncode, output.decode("utf-8", "replace"), error.decode("utf-8", "replace")
              finally:
                  # Stop only this smoke step's owned group, including timed-out children.
                  try:
                      os.killpg(child.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  child.wait(timeout=5)

          diagnostic = {"stage": "credentials", "cli_exit": None, "version": "unknown",
                        "stdout_candidates": 0, "stderr_candidates": 0,
                        "status": "unknown", "auth_state": "unknown"}
          try:
              if not os.environ.get("FACTORY_API_KEY"):
                  raise ValueError("missing runtime credential")
              diagnostic["stage"] = "preflight"
              code, _, _ = run_captured([sys.executable, "tools/factory-access/preflight.py"], 125)
              if code != 0:
                  raise ValueError("preflight failed")
              print("Factory exact-job ledger read: PASS", flush=True)
              diagnostic["stage"] = "cli_version"
              _, output, error = run_captured(["droid", "--version"], 10)
              version = re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", (output + error).strip())
              if version:
                  diagnostic["version"] = version.group()
              diagnostic["stage"] = "cli"
              code, output, error = run_captured(["droid", "mcp", "list"], 45)
              diagnostic["cli_exit"] = code
              streams = [re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", value) for value in (output, error)]
              candidates = [[line for line in value.splitlines()
                             if re.match(r"^\s*factory-ledger(?=\s|:|$)", line)] for value in streams]
              diagnostic["stdout_candidates"], diagnostic["stderr_candidates"] = map(len, candidates)
              diagnostic["auth_state"] = "auth_required" if re.search(
                  r"authentication required|not authenticated|unauthorized|invalid[_ ]api[_ ]key",
                  "\n".join(streams), re.I) else "no_auth_error_detected"
              lines = candidates[0] + candidates[1]
              diagnostic["status"] = "no_candidate" if not lines else "ambiguous" if len(lines) > 1 else "not_connected"
              if code != 0 or len(lines) != 1:
                  raise ValueError("native connection unavailable")
              diagnostic["stage"] = "row_contract"
              # Native list rows: server, status, source, transport, tools, protocol.
              connected = re.fullmatch(
                  r"\s*factory-ledger\s+connected(?:\s+\(authenticated\))?\s+"
                  r"(?:org|runtime|user|project|folder|dynamic|builtin|unknown|—|-)\s+"
                  r"(?:http|sse|stdio)\s+[1-9][0-9]*\s+[0-9]{4}-[0-9]{2}-[0-9]{2}\s*",
                  lines[0], re.I)
              if not connected or diagnostic["auth_state"] == "auth_required":
                  raise ValueError("native connection unavailable")
              diagnostic["status"] = "connected"
              print("Factory native ledger MCP: PASS")
          except Exception:
              # No provider output, exception, credential, URL, or environment dump.
              print("Factory access smoke diagnostic: " + json.dumps(diagnostic, sort_keys=True))
              print("Factory access smoke: FAIL")
              sys.exit(1)
          PY

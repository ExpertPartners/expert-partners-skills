# Skill Map Stage 1 pipeline (architecture report: history in GitHub Archive).
# Regenerates tools/skill-map/skills-graph.json whenever a SKILL.md in this repo changes.
# The extractor exits non-zero on any dangling inherits / calls / defers-to id, duplicate
# skill id, name/folder mismatch, or frontmatter parse error, which fails this workflow.
#
# The same run regenerates the AI Workforce feed for Expert Partners HQ
# (tools/capability-feed/README.md) from the graph it just built plus the marketplace,
# plugin manifests, and SKILL.md sources, and commits it with the graph on main, so the
# feed can never lag the graph it is derived from. The feed is refused, and this
# workflow fails, when a source is invalid, the feed would break HQ's contract, or any
# value fails the public-safety scan.
#
# Two jobs. validate runs on every ref with a read-only token and no secrets, so
# Dependabot and other branch pushes, which get no Actions secrets (docs.github.com,
# Troubleshooting Dependabot on GitHub Actions, verified 2026-11-04), validate the same
# way as everyone else. publish runs only on main: it alone mints the app token and
# commits, through tools/skills-graph-ci/publish_generated.py, which rebuilds from the
# newest main on every attempt instead of rebasing an older generated commit.
name: skills-graph

on:
  push:
    # All branches, tags excluded: a defined branches filter drops tag refs
    # (docs.github.com workflow-syntax, verified 2026-08-05). Evidence tags
    # point at intentionally broken proof commits and must never fire this.
    # '**' (not [main]) because branch pushes keep validation by design.
    branches: ["**"]
    paths:
      - "**/SKILL.md"
      - "tools/skill-map/**"
      - "tools/skill-deploy/**"
      # A canonical skill's non-SKILL.md files (references/, templates/, scripts/)
      # are part of the skill even though no SKILL.md moved, so watch them too.
      - "skills/**"
      - "plugins/*/skills/**"
      # AI Workforce feed inputs and producer. A package description, version, or
      # README shelf changes what HQ shows even when no SKILL.md moved.
      - ".claude-plugin/marketplace.json"
      - "plugins/*/.claude-plugin/**"
      - "plugins/*/README.md"
      - "tools/capability-feed/**"
      # The writer and this workflow.
      - "tools/skills-graph-ci/**"
      - ".github/workflows/skills-graph.yml"
  # The durable later attempt. When main keeps moving through every writer attempt, the
  # run ends deferred instead of looping, and this hourly run rebuilds from the newest
  # main. It commits nothing when main is already current. Scheduled runs use the
  # default branch, can be delayed at the top of the hour, and pause after 60 days
  # without repository activity (docs.github.com, Events that trigger workflows,
  # verified 2026-11-04).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# A superseded run is pure waste -- the newer push's run rebuilds the full
# graph anyway -- so cancel it instead of letting it lose the push race and
# page red. Cancelled runs are excluded by the CI watcher.
concurrency:
  group: skills-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate + regenerate skills-graph.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout expert-partners-skills (read-only)
        uses: actions/checkout@v6
        with:
          path: eps
          fetch-depth: 0 # committed history is required to prove VERIFIED STALE copies
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pipeline dependencies
        working-directory: eps/tools/skill-map
        run: npm ci

      # Regression coverage for the two tools this job depends on (added 2026-09-04):
      # the extractor must keep failing REAL duplicate canonical ids while
      # accepting pipeline-produced deployed copies, and deploy-skill.sh must keep
      # producing copies whose manifest is true and whose drift --verify catches.
      - name: Pipeline tests (extractor fixtures + deploy-skill contract)
        working-directory: eps
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          (cd tools/skill-map && npm test)
          bash tools/skill-deploy/test/test-deploy-skill.sh

      # The feed producer's own proofs (determinism, refusal on invalid sources, no
      # leaks, relationships and collection membership resolve, nothing promoted to
      # Active without verification, drift detection, source-change behavior).
      - name: AI Workforce feed tests
        working-directory: eps/tools/capability-feed
        run: |
          set -euo pipefail
          npm ci
          npm test

      # The main writer against temporary Git remotes (competing generated commits,
      # main moving during a retry, a real validation failure, an exhausted budget),
      # and this workflow's secret-free branch path.
      - name: Writer and workflow tests
        working-directory: eps
        run: python3 -m unittest discover -s tools/skills-graph-ci/tests -p 'test_*.py' -v

      - name: Extract and validate (fails on any dangling reference)
        working-directory: eps/tools/skill-map
        run: node extract-skills-graph.mjs --eps "$GITHUB_WORKSPACE/eps" --out "$GITHUB_WORKSPACE/eps/tools/skill-map/skills-graph.json"

      # Built from the graph the step above just regenerated. Nothing is written here:
      # on main the publish job rebuilds and commits from the newest main. A branch
      # that edits the feed file itself must carry exactly what the generator produces
      # from that branch's committed sources, so a hand edit fails here.
      - name: Generate and validate the AI Workforce feed
        working-directory: eps
        run: |
          set -euo pipefail
          FEED=tools/capability-feed/ai-workforce-feed.json
          node tools/capability-feed/generate-feed.mjs
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            exit 0
          fi
          git show HEAD:tools/skill-map/skills-graph.json > "$RUNNER_TEMP/committed-skills-graph.json"
          if node tools/capability-feed/generate-feed.mjs --check --graph "$RUNNER_TEMP/committed-skills-graph.json"; then
            exit 0
          fi
          if git rev-parse --verify --quiet origin/main >/dev/null && git diff --quiet origin/main...HEAD -- "$FEED"; then
            echo "::notice title=AI Workforce feed regenerates on merge::This branch changes feed sources but not $FEED. The skills-graph run on main regenerates and commits it; no action needed."
            exit 0
          fi
          echo "::error title=AI Workforce feed drift::$FEED differs from what this branch's committed sources produce. It is generated output: run node tools/capability-feed/generate-feed.mjs --write, never hand-edit it."
          exit 1

  publish:
    name: commit regenerated graph and AI Workforce feed (main only)
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The regenerated graph is committed to main by this app, the one actor
      # allowed past the pull request rule on main (Decision Log 2026-10-31).
      # Client ID is a repository variable, the private key a repository secret.
      - name: Mint skills-graph app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SKILLS_GRAPH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_GRAPH_APP_PRIVATE_KEY }}

      - name: Checkout expert-partners-skills
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: eps
          fetch-depth: 0 # committed history is required to prove VERIFIED STALE copies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Each attempt checks out the newest main in this job's own checkout, runs the
      # extractor and feed generator there, verifies the feed, and pushes only the two
      # generated files. A push rejected because main moved starts over from the new
      # tip. Exit 75 means main moved through every attempt: the run stays green with a
      # warning and the scheduled run above catches up. The writer is copied out first
      # because each attempt replaces the checkout it would otherwise run from.
      - name: Commit regenerated graph and AI Workforce feed (main only)
        id: publish
        working-directory: eps
        env:
          SKILLS_GRAPH_CI_DISPOSABLE_CHECKOUT: ${{ github.workspace }}/eps
        run: |
          set -euo pipefail
          git config user.name "skills-graph-bot"
          git config user.email "actions@users.noreply.github.com"
          cp tools/skills-graph-ci/publish_generated.py "$RUNNER_TEMP/publish_generated.py"
          rc=0
          python3 "$RUNNER_TEMP/publish_generated.py" --repo "$GITHUB_WORKSPACE/eps" --expect-ref refs/heads/main || rc=$?
          if [ "$rc" -eq 75 ]; then
            exit 0
          fi
          exit "$rc"

      # What landed on main must be exactly what the canonical sources produce. A
      # stale or hand-edited feed on main fails here, after the bot commit above.
      - name: Verify the committed AI Workforce feed matches its sources (main only)
        if: steps.publish.outputs.result != 'deferred'
        working-directory: eps
        run: node tools/capability-feed/generate-feed.mjs --check

name: video-discovery

on:
  pull_request:
    paths:
      - 'plugins/research-ops/skills/video-discovery/**'
      - '.github/workflows/video-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/research-ops/skills/video-discovery/**'
      - '.github/workflows/video-discovery.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r plugins/research-ops/skills/video-discovery/requirements-dev.txt
      - name: Run synthetic tests (no creator retrievals)
        run: python -m pytest plugins/research-ops/skills/video-discovery/tests -q

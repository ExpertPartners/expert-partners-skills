name: ci-gates

# Expert Partners CI quality gates -- deployed from L6 Gatekeeper (aura).
# Mirrors .pre-commit-config.yaml: same ruleset, server-side enforced.
# Gates the diff (changed files); gitleaks scans full history.
# Tools live in .ep/ -- self-contained, with one named exception: the ruling
# provenance gate resolves aura-repo citations via a read-only checkout using
# the existing SKILLS_GRAPH_TOKEN secret (same credential the skills-graph
# job already uses for the same purpose).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-and-classification:
    name: brand + classification lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed text files
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GLOBS=( '*.md' '*.markdown' '*.mdx' '*.txt' '*.rst' )
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git ls-files -- "${GLOBS[@]}" > changed_files.txt
          else
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- "${GLOBS[@]}" > changed_files.txt
          fi
          echo "count=$(grep -c . changed_files.txt || true)" >> "$GITHUB_OUTPUT"
          echo "Changed text files:"; cat changed_files.txt

      - name: Brand-naming lint (F2+F4)
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep . changed_files.txt)
          python3 .ep/brand-lint.py "${FILES[@]}"

      - name: Classification frontmatter lint (F5)
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          mapfile -t FILES < <(grep . changed_files.txt | grep -E '\.(md|markdown|mdx)$' || true)
          if [ "${#FILES[@]}" -gt 0 ]; then
            python3 .ep/frontmatter-lint.py --schema .ep/classification-schema.json "${FILES[@]}"
          fi

      # F6 -- Agent Skills description cap. Runs on EVERY push, not only when a SKILL.md
      # is in the diff: the gate is repo-wide, the headroom table is the point, and a
      # cheap always-on sweep means a breach can never ride in behind an unrelated change.
      # --selftest proves the no-PyYAML fallback still agrees with PyYAML character for
      # character, so the pre-commit path (system python3, no pyyaml) stays trustworthy.
      - name: Agent Skills description cap (F6)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .ep/skill-description-lint.py --selftest

  ruling-provenance:
    name: ruling provenance gate (citations, supersession, disclosure)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expert-partners-skills
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Read-only cross-repo checkout for resolving aura-repo ruling citations.
      # Reuses the SKILLS_GRAPH_TOKEN secret already granted for this exact
      # purpose by the skills-graph workflow; this is a second READ of an
      # already-existing credential, not a new grant.
      - name: Checkout aura (for cross-repo ruling citation resolution)
        uses: actions/checkout@v6
        with:
          repository: ExpertPartners/aura
          token: ${{ secrets.SKILLS_GRAPH_TOKEN }}
          path: aura-ref

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline selftest (fixture proof, no PyYAML, system python3)
        run: python3 .ep/ruling-provenance-lint.py --selftest --aura-path "$GITHUB_WORKSPACE/aura-ref"

      - name: Live diff check (BASE_SHA..HEAD_SHA)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # First push on a branch with no prior SHA to diff against: diff
            # against this repo's empty tree so the gate still runs on the
            # full file set rather than silently no-op'ing.
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          python3 .ep/ruling-provenance-lint.py --ci "$BASE_SHA" "$HEAD_SHA" --aura-path "$GITHUB_WORKSPACE/aura-ref"

  gitleaks:
    name: gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks git . --redact -v --config .gitleaks.toml

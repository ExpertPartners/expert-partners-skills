name: ci-gates

# Expert Partners CI quality gates (L6 Gatekeeper).
# Mirrors .pre-commit-config.yaml: same ruleset, server-side enforced.
# Gates the diff (changed files); gitleaks scans full history.
# Tools live in .ep/ -- self-contained.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-and-classification:
    name: brand + classification lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Determine changed text files
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          GLOBS=( '*.md' '*.markdown' '*.mdx' '*.txt' '*.rst' )
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # No prior SHA to diff against (workflow_dispatch, or the first
            # push of a branch). This gate is diff-scoped (header comment:
            # "Gates the diff"); sweeping every tracked file here lints files
            # the commit never touched and can never pass while brand docs
            # deliberately quote counter-examples (e.g. the misspellings the
            # ag-personal-brand skill exists to forbid). Gate the tip commit
            # instead; only a parentless first commit falls back to the empty
            # tree.
            BASE_SHA=$(git rev-parse --verify --quiet "${HEAD_SHA}^" || git hash-object -t tree /dev/null)
          fi
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- "${GLOBS[@]}" > changed_files.txt
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.py' > changed_python_files.txt
          echo "count=$(grep -c . changed_files.txt || true)" >> "$GITHUB_OUTPUT"
          echo "python_count=$(grep -c . changed_python_files.txt || true)" >> "$GITHUB_OUTPUT"
          echo "Changed text files:"; cat changed_files.txt
          echo "Changed Python files:"; cat changed_python_files.txt

      - name: Brand-naming lint (F2+F4)
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep . changed_files.txt)
          python3 .ep/brand-lint.py "${FILES[@]}"

      - name: Classification frontmatter lint (F5)
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r requirements-tooling.txt
          mapfile -t FILES < <(grep . changed_files.txt | grep -E '\.(md|markdown|mdx)$' || true)
          if [ "${#FILES[@]}" -gt 0 ]; then
            python3 .ep/frontmatter-lint.py --schema .ep/classification-schema.json "${FILES[@]}"
          fi

      # F6 -- Agent Skills description cap. Runs on EVERY push, not only when a SKILL.md
      # is in the diff: the gate is repo-wide, the headroom table is the point, and a
      # cheap always-on sweep means a breach can never ride in behind an unrelated change.
      # --selftest proves the no-PyYAML fallback still agrees with PyYAML character for
      # character, so the pre-commit path (system python3, no pyyaml) stays trustworthy.
      - name: Agent Skills description cap (F6)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --require-hashes -r requirements-tooling.txt
          python3 .ep/skill-description-lint.py --selftest

      - name: Python formatting (changed files)
        if: steps.changed.outputs.python_count != '0'
        run: |
          set -euo pipefail
          mapfile -t FILES < <(grep . changed_python_files.txt)
          python3 -m ruff format --check "${FILES[@]}"

      - name: Validate AGENTS.md links
        run: python3 tools/readiness/check_agents_links.py

      - name: AGENTS.md link validator tests
        run: python3 -m unittest discover -s tools/readiness/tests -p 'test_agents_links.py' -v

  gitleaks:
    name: gitleaks secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan repository history
        run: gitleaks git . --redact -v --config .gitleaks.toml
